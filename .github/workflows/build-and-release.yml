name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: simple_sq_music_plus_web
  DOCKER_IMAGE_NAME: simple_sq_music_plus_web

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Zip build artifacts
        run: |
          cd dist
          zip -r ../${{ env.APP_NAME }}.zip .
          cd ..

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ env.APP_NAME }}.zip
          asset_name: ${{ env.APP_NAME }}.zip
          asset_content_type: application/zip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build the Docker image
        run: |
          docker version
          # 登录阿里云镜像仓库
          docker login --username=$DOCKER_USERNAME --password=$DOCKER_PASSWORD registry.cn-hangzhou.aliyuncs.com
          # 使用Dockerfile构建镜像
          docker build . --file Dockerfile --tag registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:v$APP_VERSION
          # 推送镜像到镜像仓库
          docker push registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:v$APP_VERSION
      - name: Push to GitHub Packages
        run: |
          docker version
           # 登录 GitHub Packages
          docker login ghcr.io --username=${{ github.actor }} --password=${{ secrets.GITHUB_TOKEN }}
          
          # 构建 Docker 镜像
          docker build . --file Dockerfile --tag ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:v$APP_VERSION
          
          # 推送镜像到 GitHub Packages
          docker push ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:v$APP_VERSION
