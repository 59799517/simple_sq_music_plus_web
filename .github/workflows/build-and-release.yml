name: Build and Release

on:
  push:
    branches: [ v3, v2 ]
  workflow_dispatch:
env:
  APP_NAME: simple_sq_music_plus_web
  ALIYUN_IMAGE: registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web
  GHCR_IMAGE: ghcr.io/${{ github.actor }}/simple_sq_music_plus_web

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Set version from input if provided
        if: ${{ github.event.inputs.release_version != '' }}
        run: |
          echo "VERSION=${{ github.event.inputs.release_version }}" >> $GITHUB_ENV

      - name: Zip build artifacts
        run: |
          cd dist
          zip -r ../${{ env.APP_NAME }}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: ${{ env.APP_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Docker 部分 ----

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) 多架构主 tag（VERSION + latest），docker pull 时自动选架构
      - name: Build and push multi-arch image (latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ALIYUN_IMAGE }}:${{ env.VERSION }}
            ${{ env.ALIYUN_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ env.VERSION }}
            ${{ env.GHCR_IMAGE }}:latest

      # 2) AMD64 专属 tag
      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ALIYUN_IMAGE }}:${{ env.VERSION }}-amd64
            ${{ env.GHCR_IMAGE }}:${{ env.VERSION }}-amd64

      # 3) ARM64 专属 tag（VERSION-arm64 + latest-arm64）
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ALIYUN_IMAGE }}:${{ env.VERSION }}-arm64
            ${{ env.ALIYUN_IMAGE }}:latest-arm64
            ${{ env.GHCR_IMAGE }}:${{ env.VERSION }}-arm64
            ${{ env.GHCR_IMAGE }}:latest-arm64
