name: Build and Release

on:
  push:
    branches: [ v3, v2 ]
  workflow_dispatch:
    inputs:
      release_version:
        description: '自定义发布版本号（可选，留空则使用 package.json 版本）'
        required: false
        default: ''

env:
  APP_NAME: simple_sq_music_plus_web
  DOCKER_IMAGE_NAME: simple_sq_music_plus_web

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Set version from input if provided
        if: ${{ github.event.inputs.release_version != '' }}
        run: |
          echo "VERSION=${{ github.event.inputs.release_version }}" >> $GITHUB_ENV

      - name: Zip build artifacts
        run: |
          cd dist
          zip -r ../${{ env.APP_NAME }}.zip .
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            ${{ env.APP_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========== 阿里云镜像构建（已修复所有报错） ==========
      - name: Build and push Docker images to Alibaba Cloud
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          attestations: []
          format: docker
          tags: |
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:${{ env.VERSION }}
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:latest
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:${{ env.VERSION }}-amd64
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:${{ env.VERSION }}-arm64
            registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus_web:latest-arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========== GitHub Packages 镜像构建 ==========
      - name: Build and push Docker images to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:${{ env.VERSION }}
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:latest
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:${{ env.VERSION }}-amd64
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:${{ env.VERSION }}-arm64
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_web:latest-arm64
